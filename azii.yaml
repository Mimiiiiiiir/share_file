{
    "mixed-port": 7890,
    "ipv6": true,
    "allow-lan": true,
    "mode": "rule",
    "log-level": "warning",
    "disable-keep-alive": false,
    "keep-alive-idle": 10,
    "keep-alive-interval": 15,
    "unified-delay": false,
    "geo-auto-update": true,
    "geo-update-interval": 168,
    "external-controller": "127.0.0.1:9090",
    "external-ui-url": "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip",
    "external-ui": "ui",
    "external-controller-cors": {
        "allow-origins": [
            "*"
        ],
        "allow-private-network": true
    },
    "profile": {
        "store-selected": true,
        "store-fake-ip": true
    },
    "dns": {
        "enable": true,
        "listen": "0.0.0.0:1053",
        "ipv6": true,
        "respect-rules": true,
        "use-system-hosts": false,
        "nameserver": [
            "1.1.1.1#💦 Warp Pro - Best Ping 🚀"
        ],
        "proxy-server-nameserver": [
            "8.8.8.8#DIRECT"
        ],
        "nameserver-policy": {
            "raw.githubusercontent.com": "8.8.8.8#DIRECT",
            "time.cloudflare.com": "8.8.8.8#DIRECT"
        },
        "hosts": {
            "rule-set:malware": "rcode://refused",
            "rule-set:phishing": "rcode://refused",
            "rule-set:cryptominers": "rcode://refused"
        }
    },
    "tun": {
        "enable": true,
        "stack": "mixed",
        "auto-route": true,
        "strict-route": true,
        "auto-detect-interface": true,
        "dns-hijack": [
            "any:53",
            "tcp://any:53"
        ],
        "mtu": 9000
    },
    "sniffer": {
        "enable": true,
        "force-dns-mapping": true,
        "parse-pure-ip": true,
        "override-destination": true,
        "sniff": {
            "HTTP": {
                "ports": [
                    80,
                    8080,
                    8880,
                    2052,
                    2082,
                    2086,
                    2095
                ]
            },
            "TLS": {
                "ports": [
                    443,
                    8443,
                    2053,
                    2083,
                    2087,
                    2096
                ]
            }
        }
    },
    "proxies": [
        {
            "name": "💦 1 - Warp Pro 🇮🇷",
            "type": "wireguard",
            "ip": "10.0.131.80/32",
            "ipv6": "2a0e:1c80:1337:1:10:0:131:80/128",
            "ip-version": "dual",
            "private-key": "AAzL8Rqix4ol8YNcioSebJdsd1LWqGwpqWpnazzenkM=",
            "server": "nl-ams.azirevpn.net",
            "port": 51820 ,
            "public-key": "W+LE+uFRyMRdYFCf7Jw0OPERNd1bcIm0gTKf/traIUk=",
            "allowed-ips": [
                "0.0.0.0/0",
                "::/0"
            ],
            "udp": true,
            "mtu": 1410,
            "amnezia-wg-option": {
                "jc": "5",
                "jmin": "50",
                "jmax": "100"
            }
        },
        {
            "name": "💦 1 - WoW Pro 🌍",
            "type": "wireguard",
            "ip": "172.16.0.2/32",
            "ipv6": "2606:4700:110:824e:76e1:a7ba:f67f:e1bc/128",
            "ip-version": "dual",
            "private-key": "Dy6LnK31fsilgv+jtgwPuvCc9yWU0lOSPJfNUWqUEJw=",
            "server": "162.159.192.1",
            "port": 2408,
            "public-key": "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=",
            "allowed-ips": [
                "0.0.0.0/0",
                "::/0"
            ],
            "reserved": "IYpc",
            "udp": true,
            "mtu": 1280,
            "dialer-proxy": "💦 1 - Warp Pro 🇮🇷"
        }
    ],
    "proxy-groups": [
        {
            "name": "✅ Selector",
            "type": "select",
            "proxies": [
                "💦 Warp Pro - Best Ping 🚀",
                "💦 WoW Pro - Best Ping 🚀",
                "💦 1 - Warp Pro 🇮🇷",
                "💦 1 - WoW Pro 🌍"
            ]
        },
        {
            "name": "💦 Warp Pro - Best Ping 🚀",
            "type": "url-test",
            "url": "https://www.gstatic.com/generate_204",
            "interval": 30,
            "tolerance": 50,
            "proxies": [
                "💦 1 - Warp Pro 🇮🇷"
            ]
        },
        {
            "name": "💦 WoW Pro - Best Ping 🚀",
            "type": "url-test",
            "url": "https://www.gstatic.com/generate_204",
            "interval": 30,
            "tolerance": 50,
            "proxies": [
                "💦 1 - WoW Pro 🌍"
            ]
        }
    ],
    "rule-providers": {
        "malware": {
            "type": "http",
            "format": "text",
            "behavior": "domain",
            "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware.txt",
            "path": "./ruleset/malware.txt",
            "interval": 86400
        },
        "malware-cidr": {
            "type": "http",
            "format": "text",
            "behavior": "ipcidr",
            "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware-ip.txt",
            "path": "./ruleset/malware-cidr.txt",
            "interval": 86400
        },
        "phishing": {
            "type": "http",
            "format": "text",
            "behavior": "domain",
            "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/phishing.txt",
            "path": "./ruleset/phishing.txt",
            "interval": 86400
        },
        "phishing-cidr": {
            "type": "http",
            "format": "text",
            "behavior": "ipcidr",
            "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/phishing-ip.txt",
            "path": "./ruleset/phishing-cidr.txt",
            "interval": 86400
        },
        "cryptominers": {
            "type": "http",
            "format": "text",
            "behavior": "domain",
            "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/cryptominers.txt",
            "path": "./ruleset/cryptominers.txt",
            "interval": 86400
        }
    },
    "rules": [
        "GEOIP,lan,DIRECT,no-resolve",
        "RULE-SET,malware,REJECT",
        "RULE-SET,phishing,REJECT",
        "RULE-SET,cryptominers,REJECT",
        "RULE-SET,malware-cidr,REJECT",
        "RULE-SET,phishing-cidr,REJECT",
        "MATCH,✅ Selector"
    ],
    "ntp": {
        "enable": true,
        "server": "time.cloudflare.com",
        "port": 123,
        "interval": 30
    }
}
